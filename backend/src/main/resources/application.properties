server.port=8080

# MySQL local (criado por scripts/mysql-iniciar.ps1). Sobrescreva por variável de ambiente.
spring.datasource.url=${SGF_DB_URL:jdbc:mysql://localhost:3306/sgf?connectionTimeZone=LOCAL&characterEncoding=UTF-8}
spring.datasource.username=${SGF_DB_USUARIO:sgf}
spring.datasource.password=${SGF_DB_SENHA:sgf}
spring.flyway.enabled=true

# Pasta onde as fotos das ocorrências são gravadas.
sgf.fotos-dir=${SGF_FOTOS_DIR:C:/Users/mauri/OneDrive/Documentos/fotos sfg-seguranca}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
